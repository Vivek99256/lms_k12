version: 2
updates:
  # Security and version updates for npm packages, batched weekly so they arrive
  # as a reviewable PR rather than a stream.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
