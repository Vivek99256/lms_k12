<style>
  body { margin: 0; padding: 24px; background: var(--surface-canvas); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
  .lbl { width: 100%; font: 600 11px/1 var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--content-tertiary); margin-bottom: 2px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

<body data-theme="light" style="color-scheme:light">
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Popover, Tooltip, Select } = window.EduERPDesignSystem_d63b75;

function Demo(){
  return (<div>
    <div className="row"><span className="lbl">Popover &amp; tooltip (inline, non-blocking)</span>
      <Popover trigger={<Button variant="secondary" iconStart="filter">Filters</Button>}>
        {({close})=>(<div style={{padding:12,display:"flex",flexDirection:"column",gap:10,width:220}}>
          <Select label="Class" options={[{value:"9",label:"Grade 9"},{value:"10",label:"Grade 10"}]} />
          <Button variant="primary" size="sm" onClick={close}>Apply</Button>
        </div>)}
      </Popover>
      <Tooltip label="Export to Excel"><IconButton icon="download" label="Export" /></Tooltip>
      <Tooltip label="Print report"><IconButton icon="printer" label="Print" /></Tooltip>
    </div>
    <div style={{marginTop:8,padding:16,border:"1px dashed var(--border-default)",borderRadius:8,color:"var(--content-secondary)",fontSize:13}}>
      Modal, ConfirmationDialog and Drawer render as full-screen overlays — they are exercised in the UI kit. See <b>components/overlays/*.prompt.md</b> for usage.
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
