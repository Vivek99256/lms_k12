<!-- @dsCard group="Components" viewport="620x560" name="Assistant" subtitle="Docked AI copilot panel (chat + composer) with the floating agent launcher" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 20px; background: var(--surface-canvas); }
  .wrap { display: flex; gap: 16px; align-items: stretch; height: 512px; }
  .panel { border: 1px solid var(--border-subtle); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-raised); }
  .rail { display: flex; align-items: flex-end; }
</style>
</head>
<body data-theme="light" style="color-scheme:light">
<div id="root"></div>
<script type="text/babel">
const { AssistantPanel, AssistantLauncher } = window.EduERPDesignSystem_d63b75;
const GREETING = { id:"g", role:"assistant", text:"Hello! I'm your Teach Assistant. Ask me about students, fees, attendance or reports.", time:"10:00 AM" };
function Demo(){
  const [messages,setMessages]=React.useState([GREETING, {id:"u1",role:"user",text:"Summarise fee defaulters"}, {id:"a1",role:"assistant",text:"42 students have pending Term-2 fees totalling ₹1,13,060. Want me to draft reminders?",time:"10:01 AM"}]);
  const [typing,setTyping]=React.useState(false);
  const t=React.useRef(null);
  React.useEffect(()=>()=>clearTimeout(t.current),[]);
  const send=(text)=>{ setMessages(m=>[...m,{id:"u"+Date.now(),role:"user",text}]); setTyping(true); clearTimeout(t.current); t.current=setTimeout(()=>{ setMessages(m=>[...m,{id:"a"+Date.now(),role:"assistant",text:"On it — in the live product I'd pull the figures and offer to export or share them.",time:"now"}]); setTyping(false); },1100); };
  return (
    <div className="wrap">
      <div className="panel">
        <AssistantPanel title="Teach Assistant" status="Online" messages={messages} typing={typing}
          suggestions={[{text:"Draft parent notice",icon:"mail"},{text:"Attendance dip?",icon:"calendar-check"}]}
          onSend={send} onNewChat={()=>setMessages([GREETING])} />
      </div>
      <div className="rail">
        <AssistantLauncher primaryLabel="Ask Teach Assistant" onPrimary={()=>{}} activeId="recommend" onSelect={()=>{}}
          items={[{id:"insights",icon:"trending-up",label:"Insights"},{id:"recommend",icon:"lightbulb",label:"Recommendations",badge:true},{id:"help",icon:"life-buoy",label:"Help"}]} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
