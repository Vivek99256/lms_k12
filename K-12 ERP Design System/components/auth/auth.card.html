<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--surface-canvas); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
  .lbl { width: 100%; font: 600 11px/1 var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--content-tertiary); margin-bottom: 2px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  
</style>
</head>
<body data-theme="light" style="color-scheme:light">
<div id="root"></div>
<script type="text/babel">
const { AuthForm, OtpInput, PasswordStrengthMeter, TextField } = window.EduERPDesignSystem_d63b75;

function Demo(){
  const [code,setCode]=React.useState("");
  const [pw,setPw]=React.useState("Passw0rd!");
  return (<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24,alignItems:"start"}}>
    <AuthForm mode="login" onSubmit={()=>{}} footer={<>New institution? <a href="#">Request access</a></>} />
    <div style={{display:"flex",flexDirection:"column",gap:20}}>
      <div><div className="lbl">OTP input</div><OtpInput length={6} value={code} onChange={setCode} /></div>
      <div><div className="lbl">Password strength</div>
        <TextField type="password" value={pw} onChange={e=>setPw(e.target.value)} />
        <div style={{marginTop:8}}><PasswordStrengthMeter value={pw} /></div>
      </div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
