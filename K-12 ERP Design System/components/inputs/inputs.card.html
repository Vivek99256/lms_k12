<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--surface-canvas); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 640px; }
</style>
</head>
<body data-theme="light" style="color-scheme:light">
<div id="root"></div>
<script type="text/babel">
const { TextField, Textarea, SearchInput, DatePicker } = window.EduERPDesignSystem_d63b75;
function Demo() {
  const [d, setD] = React.useState(new Date());
  return (
    <div className="grid">
      <TextField label="Student name" placeholder="Full name" required />
      <TextField label="Email" type="email" iconStart="mail" helperText="Parent's primary email" />
      <TextField label="Admission no." errorText="Already exists" defaultValue="ADM-0421" />
      <TextField label="Password" type="password" defaultValue="secret123" />
      <SearchInput placeholder="Search students…" defaultValue="Aarav" />
      <DatePicker label="Date of birth" value={d} onChange={setD} />
      <div style={{ gridColumn: "1 / -1" }}>
        <Textarea label="Remarks" rows={2} maxLength={200} placeholder="Add a note…" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
