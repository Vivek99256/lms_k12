<!-- @dsCard group="Shape" viewport="700x170" name="Elevation / shadow" subtitle="raised → modal" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-default); font-family: var(--font-sans); color: var(--content-primary); }
  .swatches { display: flex; gap: 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-subtle); }
  .sw { flex: 1; height: 64px; display: flex; align-items: flex-end; padding: 5px; }
  .sw span { font: 600 9px/1.2 var(--font-mono); }
  .tokrow { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--border-subtle); border-radius: 8px; font-size: 12px; color: var(--content-secondary); background: var(--surface-default); }
  .dot { width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0; border: 1px solid rgba(0,0,0,.08); }
  .mono { font-family: var(--font-mono); font-size: 11px; color: var(--content-tertiary); }
  
</style>
</head>
<body data-theme="light" style="color-scheme:light">

  <div style="display:flex;gap:22px;padding:6px 4px 10px">
    <div style="text-align:center"><div style="width:80px;height:56px;background:var(--surface-default);border-radius:8px;box-shadow:var(--shadow-sm)"></div><div class="mono" style="margin-top:10px">raised</div></div><div style="text-align:center"><div style="width:80px;height:56px;background:var(--surface-default);border-radius:8px;box-shadow:var(--shadow-md)"></div><div class="mono" style="margin-top:10px">sticky</div></div><div style="text-align:center"><div style="width:80px;height:56px;background:var(--surface-default);border-radius:8px;box-shadow:var(--shadow-lg)"></div><div class="mono" style="margin-top:10px">dropdown</div></div><div style="text-align:center"><div style="width:80px;height:56px;background:var(--surface-default);border-radius:8px;box-shadow:var(--shadow-xl)"></div><div class="mono" style="margin-top:10px">overlay</div></div><div style="text-align:center"><div style="width:80px;height:56px;background:var(--surface-default);border-radius:8px;box-shadow:var(--shadow-2xl)"></div><div class="mono" style="margin-top:10px">modal</div></div>
  </div>
</body>
</html>
