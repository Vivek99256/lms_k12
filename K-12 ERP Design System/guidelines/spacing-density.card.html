<!-- @dsCard group="Spacing" viewport="700x170" name="Density modes" subtitle="Row heights: comfortable / cozy / compact" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-default); font-family: var(--font-sans); color: var(--content-primary); }
  .swatches { display: flex; gap: 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-subtle); }
  .sw { flex: 1; height: 64px; display: flex; align-items: flex-end; padding: 5px; }
  .sw span { font: 600 9px/1.2 var(--font-mono); }
  .tokrow { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--border-subtle); border-radius: 8px; font-size: 12px; color: var(--content-secondary); background: var(--surface-default); }
  .dot { width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0; border: 1px solid rgba(0,0,0,.08); }
  .mono { font-family: var(--font-mono); font-size: 11px; color: var(--content-tertiary); }
  
</style>
</head>
<body data-theme="light" style="color-scheme:light">

  <div style="display:flex;gap:16px;align-items:flex-end">
    <div style="text-align:center"><div style="width:150px;height:48px;background:var(--surface-subtle);border:1px solid var(--border-default);border-radius:6px;display:flex;align-items:center;padding:0 12px;font-size:13px;color:var(--content-secondary)">Row · 48px</div><div class="mono" style="margin-top:6px">Comfortable</div></div><div style="text-align:center"><div style="width:150px;height:40px;background:var(--surface-subtle);border:1px solid var(--border-default);border-radius:6px;display:flex;align-items:center;padding:0 12px;font-size:13px;color:var(--content-secondary)">Row · 40px</div><div class="mono" style="margin-top:6px">Cozy</div></div><div style="text-align:center"><div style="width:150px;height:32px;background:var(--surface-subtle);border:1px solid var(--border-default);border-radius:6px;display:flex;align-items:center;padding:0 12px;font-size:13px;color:var(--content-secondary)">Row · 32px</div><div class="mono" style="margin-top:6px">Compact</div></div>
  </div>
</body>
</html>
