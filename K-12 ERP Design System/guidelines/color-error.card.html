<!-- @dsCard group="Colors" viewport="700x120" name="Error — Red" subtitle="error primitive scale · 50 → 950" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-default); font-family: var(--font-sans); color: var(--content-primary); }
  .swatches { display: flex; gap: 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-subtle); }
  .sw { flex: 1; height: 64px; display: flex; align-items: flex-end; padding: 5px; }
  .sw span { font: 600 9px/1.2 var(--font-mono); }
  .tokrow { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--border-subtle); border-radius: 8px; font-size: 12px; color: var(--content-secondary); background: var(--surface-default); }
  .dot { width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0; border: 1px solid rgba(0,0,0,.08); }
  .mono { font-family: var(--font-mono); font-size: 11px; color: var(--content-tertiary); }
  
</style>
</head>
<body data-theme="light" style="color-scheme:light">
<div class="swatches"><div class="sw" style="background:var(--color-error-50)"><span style="color:rgba(0,0,0,.55)">50</span></div><div class="sw" style="background:var(--color-error-100)"><span style="color:rgba(0,0,0,.55)">100</span></div><div class="sw" style="background:var(--color-error-200)"><span style="color:rgba(0,0,0,.55)">200</span></div><div class="sw" style="background:var(--color-error-300)"><span style="color:rgba(0,0,0,.55)">300</span></div><div class="sw" style="background:var(--color-error-400)"><span style="color:rgba(0,0,0,.55)">400</span></div><div class="sw" style="background:var(--color-error-500)"><span style="color:#fff">500</span></div><div class="sw" style="background:var(--color-error-600)"><span style="color:#fff">600</span></div><div class="sw" style="background:var(--color-error-700)"><span style="color:#fff">700</span></div><div class="sw" style="background:var(--color-error-800)"><span style="color:#fff">800</span></div><div class="sw" style="background:var(--color-error-900)"><span style="color:#fff">900</span></div><div class="sw" style="background:var(--color-error-950)"><span style="color:#fff">950</span></div></div>
</body>
</html>
