<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base rhythm" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-default); font-family: var(--font-sans); color: var(--content-primary); }
  .swatches { display: flex; gap: 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-subtle); }
  .sw { flex: 1; height: 64px; display: flex; align-items: flex-end; padding: 5px; }
  .sw span { font: 600 9px/1.2 var(--font-mono); }
  .tokrow { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--border-subtle); border-radius: 8px; font-size: 12px; color: var(--content-secondary); background: var(--surface-default); }
  .dot { width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0; border: 1px solid rgba(0,0,0,.08); }
  .mono { font-family: var(--font-mono); font-size: 11px; color: var(--content-tertiary); }
  
</style>
</head>
<body data-theme="light" style="color-scheme:light">

  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:70px">space-1</span><span style="height:12px;width:4px;background:var(--action-primary);border-radius:2px"></span><span class="mono">4px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:70px">space-2</span><span style="height:12px;width:8px;background:var(--action-primary);border-radius:2px"></span><span class="mono">8px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:70px">space-3</span><span style="height:12px;width:12px;background:var(--action-primary);border-radius:2px"></span><span class="mono">12px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:70px">space-4</span><span style="height:12px;width:16px;background:var(--action-primary);border-radius:2px"></span><span class="mono">16px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:70px">space-6</span><span style="height:12px;width:24px;background:var(--action-primary);border-radius:2px"></span><span class="mono">24px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:70px">space-8</span><span style="height:12px;width:32px;background:var(--action-primary);border-radius:2px"></span><span class="mono">32px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:70px">space-12</span><span style="height:12px;width:48px;background:var(--action-primary);border-radius:2px"></span><span class="mono">48px</span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:70px">space-16</span><span style="height:12px;width:64px;background:var(--action-primary);border-radius:2px"></span><span class="mono">64px</span></div>
  </div>
</body>
</html>
