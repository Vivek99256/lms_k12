<!-- @dsCard group="Shape" viewport="700x160" name="Motion" subtitle="Durations & easing" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-default); font-family: var(--font-sans); color: var(--content-primary); }
  .swatches { display: flex; gap: 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-subtle); }
  .sw { flex: 1; height: 64px; display: flex; align-items: flex-end; padding: 5px; }
  .sw span { font: 600 9px/1.2 var(--font-mono); }
  .tokrow { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--border-subtle); border-radius: 8px; font-size: 12px; color: var(--content-secondary); background: var(--surface-default); }
  .dot { width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0; border: 1px solid rgba(0,0,0,.08); }
  .mono { font-family: var(--font-mono); font-size: 11px; color: var(--content-tertiary); }
  
</style>
</head>
<body data-theme="light" style="color-scheme:light">

  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:80px">fast</span><span style="height:8px;width:50px;background:var(--action-primary);border-radius:4px"></span><span class="mono">100ms</span><span style="font-size:12px;color:var(--content-tertiary)">hover / press</span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:80px">quick</span><span style="height:8px;width:75px;background:var(--action-primary);border-radius:4px"></span><span class="mono">150ms</span><span style="font-size:12px;color:var(--content-tertiary)">exit</span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:80px">normal</span><span style="height:8px;width:100px;background:var(--action-primary);border-radius:4px"></span><span class="mono">200ms</span><span style="font-size:12px;color:var(--content-tertiary)">enter</span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:80px">moderate</span><span style="height:8px;width:150px;background:var(--action-primary);border-radius:4px"></span><span class="mono">300ms</span><span style="font-size:12px;color:var(--content-tertiary)">overlays</span></div>
  </div>
  <p style="font-size:12px;color:var(--content-tertiary);margin-top:10px">Standard easing cubic-bezier(0.2, 0, 0, 1). Honors prefers-reduced-motion.</p>
</body>
</html>
